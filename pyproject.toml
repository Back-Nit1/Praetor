[project]
name = "nemesis"
version = "0.1.0"
description = "Personal security agent: public digital twin, simulated attackers, minimal fixes."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "openai>=1.30",
  "tavily-python>=0.3",
  "networkx>=3.2",
  "scipy>=1.11",
  "pydantic>=2.6",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "pyyaml>=6",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: hits live services (excluded from test-fast)",
  "slow: >1s (excluded from test-fast)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
